<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      addEventListener("click", display);
      function display() {
        addEventListener("mousemove", (event) => {
          document.write("x : ", event.clientX, " Y : ", event.clientY);
        });
      }
      addEventListener("keypress", (event) => {
        document.write(event.key, " ", event.keyCode, "<br>");
      });
    </script>
  </body>
</html>
