<html>
	<head>
		<title>
		 table using HTML Tags
		</title>
	</head>
	<body>
		<table border="1px" align = "center" cellpadding="20px" cellspacing="3px">
			<tr>
				<th colspan ="3" rowspan="2"> Today's Opinion Poll Question
				</th>
				<th colspan ="3"> Political Party
				</th>
			</tr> 
			<tr>
				<td> Democrate </td>
				<td> Republican </td>
				<td> independent </td>
			</tr>
			
			 <tr> 
				<td rowspan="3" colspan="2"> 
					"Do you favor or oppose <br>increasing the minimum <br>wage?"
				</td>
				<td> Favor </td>
				<td align="right" valign="middle" > 70% </td> 
				<td align="right" valign="middle" > 35% </td>
				<td align="right" valign="middle" > 55% </td>
			</tr>
			<tr>
				<td> Oppose </td>
				<td align="right" valign="middle" > 25% </td> 
				<td align="right" valign="middle" > 60% </td>
				<td align="right" valign="middle" > 30% </td>
			</tr>
			<tr>
				<td> Unsure </td>
				<td align="right" valign="middle" > 5% </td> 
				<td align="right" valign="middle" > 5% </td>
				<td align="right" valign="middle" > 15% </td>
			</tr>
		</table>
	</body>
</html>
