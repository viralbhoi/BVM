<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let first = Number(prompt("Enter lower limit"));
        let last = Number(prompt("Enter Upper limit"));
        
        function isPrime(num){
            if(num == 1){
                return false
            }else if(num ==2){
                return true;
            }

            for(let i=2; i<= Math.sqrt(num);i++){
                if(num % i == 0){
                    return false;
                }
            }

            return true;
        }

        for(let i=first;i<=last;i++){
            if(isPrime(i)){
                document.writeln("prime = ",i,"<br>");
            }
        }
    </script>
</body>
</html>
