<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let a = 5, b=2;
        document.writeln("5 | 2 = ",a|b, "<br>");
        document.writeln("5 & 2 = ",a&b, "<br>");
        document.writeln("5 ^ 2 = ",a^b, "<br>");
        document.writeln("!5 = ",!a, "<br>");
        document.writeln("!0 = ", !0 , "<br>");
        document.writeln("~0 = ", ~0 , "<br>");
        document.writeln("~5 = ", ~5 , "<br>");
        document.writeln("~2 = ", ~2 , "<br>");
        document.writeln("5 << 2 = ", a<<b , "<br>");
        document.writeln("5 >> 1 = ", 5>>1 , "<br>");
        document.writeln("1 << 5 = ", 1<<5 , "<br>");
        document.writeln("32 >> 2 = ", 32>>2 , "<br>");
    </script>
</body>
</html>
